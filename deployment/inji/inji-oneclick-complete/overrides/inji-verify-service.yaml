extraEnvVars:
  - name: DATABASE_HOST
    valueFrom:
      configMapKeyRef:
        name: postgres-config
        key: database-host

  - name: DATABASE_PORT
    valueFrom:
      configMapKeyRef:
        name: postgres-config
        key: database-port

  - name: DATABASE_USERNAME
    valueFrom:
      configMapKeyRef:
        name: postgres-config
        key: database-username

  - name: DATABASE_NAME
    valueFrom:
      configMapKeyRef:
        name: postgres-config
        key: database-name

  - name: DATABASE_SCHEMA
    valueFrom:
      configMapKeyRef:
        name: postgres-config
        key: database-schema

  - name: DATABASE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: inji-db-credentials
        key: password
