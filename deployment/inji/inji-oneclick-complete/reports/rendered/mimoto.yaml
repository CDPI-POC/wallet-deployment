# Source: mimoto/templates/virtualservice.yaml
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: mimoto
  namespace: mimoto
  labels:
    app.kubernetes.io/name: mimoto
    helm.sh/chart: mimoto-0.21.0
    app.kubernetes.io/instance: mimoto
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: inji
spec:
  hosts:
  - "*"
  gateways:
    - inji-web-gateway
  http:
  - match:
      - uri:
          prefix: /v1/mimoto
      - uri:
          prefix: /residentmobileapp
    rewrite:
      uri: /v1/mimoto
    route:
    - destination:
        host: mimoto
        port:
          number: 80
    headers:
      request:
        set:
          x-forwarded-proto: https
