# Source: mimoto/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: mimoto
    helm.sh/chart: mimoto-0.21.0
    app.kubernetes.io/instance: mimoto
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: inji
  name: mimoto
  annotations:
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: mimoto
      app.kubernetes.io/instance: mimoto
  template:
    metadata:
      annotations:
        
        prometheus.io/scrape: "true"
      labels:
        app.kubernetes.io/name: mimoto
        helm.sh/chart: mimoto-0.21.0
        app.kubernetes.io/instance: mimoto
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: mimoto
      
      affinity:
        podAffinity:
          
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: mimoto
                    app.kubernetes.io/instance: mimoto
                namespaces:
                  - "mimoto"
                topologyKey: kubernetes.io/hostname
              weight: 1
        nodeAffinity:
          
      initContainers:
        - name: volume-permissions
          image: "docker.io/mosipint/os-shell:12-debian-12-r46"
          imagePullPolicy: "Always"
          command:
            - /bin/bash
            - -c
            - |
              mkdir -p /home/mosip/encryption/encryptionkeystore.p12
              chown -R 1001:1001 /home/mosip/encryption/encryptionkeystore.p12
              chmod -R 775 /home/mosip/encryption/encryptionkeystore.p12
          securityContext:
            runAsUser: 0
          resources:
            limits: {}
            requests: {}
          volumeMounts:
            - mountPath: /home/mosip/encryption/encryptionkeystore.p12
              name: mimoto-encryption-volume
              subPath: encryptionkeystore.p12
      containers:
        - name: mimoto
          image: docker.io/injistack/mimoto:0.21.0
          imagePullPolicy: Always
          env:
            - name: container_user
              value: "1001"
            - name: JDK_JAVA_OPTIONS
              value: "-Xms2250M -Xmx2250M"
            - name: KEYSTORE_P12_PATH
              value: "/home/mosip/certs"
            - name: DB_DBUSER_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: inji-db-credentials
            - name: MOSIP_MIMOTO_DATABASE_HOSTNAME
              value: postgres-postgresql.postgres.svc.cluster.local
            - name: MOSIP_MIMOTO_DATABASE_PORT
              value: "5432"
          envFrom:
              - configMapRef:
                  name: "inji-stack-config"
              - configMapRef:
                  name: "config-server-share"
              - configMapRef:
                  name: "artifactory-share"
              - secretRef:
                  name: "google-client"
          volumeMounts:
            - name: landing-folder
              mountPath: /mnt/landing
            - name: mimotooidc
              mountPath: /home/mosip/certs
            - mountPath: /home/mosip/encryption/encryptionkeystore.p12
              name: mimoto-encryption-volume
              subPath: encryptionkeystore.p12
          ports: []
          resources:
            limits:
              cpu: 1000m
              memory: 5000Mi
            requests:
              cpu: 200m
              memory: 2000Mi
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /v1/mimoto/actuator/health
              port: 8099
            initialDelaySeconds: 0
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          livenessProbe:
            failureThreshold: 6
            httpGet:
              path: /v1/mimoto/actuator/health
              port: 8099
            initialDelaySeconds: 120
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          readinessProbe:
            failureThreshold: 6
            httpGet:
              path: /v1/mimoto/actuator/health
              port: 8099
            initialDelaySeconds: 30
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
      volumes:
        - name: landing-folder
          emptyDir: {}
        - name: mimotooidc
          secret:
            secretName: mimotooidc
        - name: mimoto-encryption-volume
          persistentVolumeClaim:
            claimName: mimoto-keygen-keymanager
