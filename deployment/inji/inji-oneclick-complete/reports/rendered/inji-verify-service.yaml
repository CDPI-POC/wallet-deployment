# Source: inji-verify-service/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: inji-verify-service
    helm.sh/chart: inji-verify-service-0.18.0
    app.kubernetes.io/instance: inji-verify-service
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: inji
  name: inji-verify-service
  annotations:
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: inji-verify-service
      app.kubernetes.io/instance: inji-verify-service
  template:
    metadata:
      annotations:
        
        prometheus.io/scrape: "true"
      labels:
        app.kubernetes.io/name: inji-verify-service
        helm.sh/chart: inji-verify-service-0.18.0
        app.kubernetes.io/instance: inji-verify-service
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: inji-verify-service
      
      affinity:
        podAffinity:
          
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: inji-verify-service
                    app.kubernetes.io/instance: inji-verify-service
                namespaces:
                  - "inji-verify"
                topologyKey: kubernetes.io/hostname
              weight: 1
        nodeAffinity:
          
      initContainers:
      containers:
        - name: inji-verify-service
          image: docker.io/injistack/inji-verify-service:0.18.0
          imagePullPolicy: Always
          env:
            - name: container_user
              value: "1001"
            - name: JDK_JAVA_OPTIONS
              value: "-Xms1500M -Xmx1500M"
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef:
                  key: database-host
                  name: postgres-config
            - name: DATABASE_PORT
              valueFrom:
                configMapKeyRef:
                  key: database-port
                  name: postgres-config
            - name: DATABASE_USERNAME
              valueFrom:
                configMapKeyRef:
                  key: database-username
                  name: postgres-config
            - name: DATABASE_NAME
              valueFrom:
                configMapKeyRef:
                  key: database-name
                  name: postgres-config
            - name: DATABASE_SCHEMA
              valueFrom:
                configMapKeyRef:
                  key: database-schema
                  name: postgres-config
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: inji-db-credentials
          envFrom:
            - configMapRef:
                name: inji-stack-config
          ports:
            - name: spring-service
              containerPort: 8080
          resources:
            limits:
              cpu: 500m
              memory: 2250Mi
            requests:
              cpu: 100m
              memory: 1500Mi
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /v1/verify/actuator/health
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          livenessProbe:
            failureThreshold: 6
            httpGet:
              path: /v1/verify/actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          readinessProbe:
            failureThreshold: 6
            httpGet:
              path: /v1/verify/actuator/health
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
---
