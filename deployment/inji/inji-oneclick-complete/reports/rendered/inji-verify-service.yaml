  selector:
    matchLabels:
      app.kubernetes.io/name: inji-verify-service
      app.kubernetes.io/instance: inji-verify-service
---
# Source: inji-verify-service/templates/virtualservice.yaml
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: inji-verify-service
  namespace: inji-verify
  labels:
    app.kubernetes.io/name: inji-verify-service
    helm.sh/chart: inji-verify-service-0.18.0
    app.kubernetes.io/instance: inji-verify-service
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: inji
spec:
  hosts:
  - "*"
  gateways:
    - istio-system/internal
  http:
  - match:
      - uri:
          prefix: /v1/verify
    route:
    - destination:
        host: inji-verify-service
        port:
          number: 80
    corsPolicy:
      null
    headers:
      request:
        set:
          x-forwarded-proto: https
      response:
        set:
          Cache-control: no-store
          Pragma: no-cache
          Strict-Transport-Security: max-age=31536000; includeSubDomains
          X-Frame-Options: SAMEORIGIN
