# Source: injiweb/templates/gateway.yaml
apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name:  inji-web-gateway
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
      - injiweb.sandbox.xyz.net
---
# Source: injiweb/templates/virtualservice.yaml
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: injiweb
  namespace: injiweb
  labels:
    app.kubernetes.io/name: injiweb
    helm.sh/chart: injiweb-0.16.0
    app.kubernetes.io/instance: injiweb
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: inji
spec:
  hosts:
  - "*"
  gateways:
    
    - inji-web-gateway
    
  http:
  - match:
      - uri:
          prefix: /
    route:
    - destination:
        host: injiweb
        port:
          number: 80
    headers:
      request:
        set:
          x-forwarded-proto: https
      response:
        set:
          Cache-control: no-store
          Pragma: no-cache
          Strict-Transport-Security: max-age=31536000; includeSubDomains
          X-Frame-Options: SAMEORIGIN
