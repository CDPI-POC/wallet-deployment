# Source: injiweb/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: injiweb-nginx-cm
  namespace: injiweb
  labels:
    app.kubernetes.io/name: injiweb
    helm.sh/chart: injiweb-0.16.0
    app.kubernetes.io/instance: injiweb
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: inji
data:
  nginx.conf: |-
    worker_processes  1;
    
    events {
      worker_connections  1024;
    }
    
    http {
      access_log /var/log/nginx/access1.log;
      error_log /var/log/nginx/error1.log;

      large_client_header_buffers 4 32k;
      proxy_buffer_size   128k;
      proxy_buffers   4 256k;
      proxy_busy_buffers_size   256k;
      proxy_headers_hash_bucket_size 128;
      proxy_headers_hash_max_size 512;
    
      server {
        listen 3004;
        server_name  localhost;

        root   /usr/share/nginx/html;
        index  index.html index.htm;
        include /etc/nginx/mime.types;

        gzip on;
        gzip_min_length 1000;
        gzip_proxied expired no-cache no-store private auth;
        gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

        location /v1/mimoto {
          proxy_pass         http://mimoto.injiweb/v1/mimoto;
          proxy_redirect     off;
          proxy_set_header   Host $host;
          proxy_set_header   X-Real-IP $remote_addr;
          proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header   X-Forwarded-Host $server_name;
        }
  
        location / {
          try_files $uri $uri/ /index.html;
        }
      }
    }
