# Source: injiweb/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: injiweb
    helm.sh/chart: injiweb-0.16.0
    app.kubernetes.io/instance: injiweb
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: inji
  name: injiweb
  annotations:
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: injiweb
      app.kubernetes.io/instance: injiweb
  template:
    metadata:
      annotations:
      labels:
        app.kubernetes.io/name: injiweb
        helm.sh/chart: injiweb-0.16.0
        app.kubernetes.io/instance: injiweb
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: injiweb
      
      affinity:
        podAffinity:
          
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: injiweb
                    app.kubernetes.io/instance: injiweb
                namespaces:
                  - "injiweb"
                topologyKey: kubernetes.io/hostname
              weight: 1
        nodeAffinity:
          
      initContainers:
      containers:
        - name: inji-web
          image: docker.io/injistack/inji-web:0.16.0
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 0
          env:
            - name: container_user
              value: 1001
            - name: JDK_JAVA_OPTIONS
              value: -Xms750M -Xmx750M
          envFrom:
            - configMapRef:
                name: inji-stack-config
            - configMapRef:
                name: injiweb-ui
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - mountPath: /var/log/nginx
              name: nginx-logs
          ports:
            - name: spring-service
              containerPort: 3004
          resources:
            limits:
              cpu: 300m
              memory: 1500Mi
            requests:
              cpu: 100m
              memory: 50Mi
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /
              port: 3004
            initialDelaySeconds: 0
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          livenessProbe:
            failureThreshold: 6
            httpGet:
              path: /
              port: 3004
            initialDelaySeconds: 20
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          readinessProbe:
            failureThreshold: 6
            httpGet:
              path: /
              port: 3004
            initialDelaySeconds: 0
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
      volumes:
        - name: nginx-logs
          emptyDir: {}
        - name: nginx-config
          configMap:
            name: injiweb-nginx-cm
            items:
              - key: nginx.conf
                path: nginx.conf
