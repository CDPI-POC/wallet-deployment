---
# Source: datashare/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: datashare
    helm.sh/chart: datashare-1.3.0-beta.2
    app.kubernetes.io/instance: datashare
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: mosip
  name: datashare
  annotations:
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: datashare
      app.kubernetes.io/instance: datashare
  template:
    metadata:
      annotations:
        
        prometheus.io/scrape: "true"
       
      labels:
        app.kubernetes.io/name: datashare
        helm.sh/chart: datashare-1.3.0-beta.2
        app.kubernetes.io/instance: datashare
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: datashare
      
      affinity:
        podAffinity:
          
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: datashare
                    app.kubernetes.io/instance: datashare
                namespaces:
                  - "injiweb"
                topologyKey: kubernetes.io/hostname
              weight: 1
        nodeAffinity:
          
      initContainers:
      containers:
        - name: datashare
          image: docker.io/mosipid/data-share-service:1.3.0-beta.2
          imagePullPolicy: Always
          env:
            - name: container_user
              value: mosip
            - name: JDK_JAVA_OPTIONS
              value: -Xms2000M -Xmx2000M
          envFrom:
            - configMapRef:
                name: global
            - configMapRef:
                name: config-server-share
            - configMapRef:
                name: artifactory-share
          ports:
            - name: spring-service
              containerPort: 8097
          resources:
            limits:
              cpu: 500m
              memory: 3000Mi
            requests:
              cpu: 200m
              memory: 10Mi
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /v1/datashare/actuator/health
              port: 8097
            initialDelaySeconds: 0
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          livenessProbe:
            failureThreshold: 6
            httpGet:
              path: /v1/datashare/actuator/health
              port: 8097
            initialDelaySeconds: 20
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          readinessProbe:
            failureThreshold: 6
            httpGet:
              path: /v1/datashare/actuator/health
              port: 8097
            initialDelaySeconds: 0
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
---
# Source: datashare/templates/servicemonitor.yaml
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: datashare
  namespace: "injiweb"
  labels:
    app.kubernetes.io/name: datashare
    helm.sh/chart: datashare-1.3.0-beta.2
    app.kubernetes.io/instance: datashare
    app.kubernetes.io/managed-by: Helm
spec:
  endpoints:
    - targetPort: 8097
      path: /v1/datashare/actuator/prometheus
      interval: 10s
  namespaceSelector:
    matchNames:
      - "injiweb"
  selector:
    matchLabels:
      app.kubernetes.io/name: datashare
      app.kubernetes.io/instance: datashare
---
# Source: datashare/templates/virtualservice.yaml
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: datashare
  namespace: injiweb
  labels:
    app.kubernetes.io/name: datashare
    helm.sh/chart: datashare-1.3.0-beta.2
    app.kubernetes.io/instance: datashare
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: mosip
spec:
  hosts:
  - "*"
  gateways:
  - istio-system/internal
  http:
  - match:
      - uri:
          prefix: /v1/datashare
    route:
    - destination:
        host: datashare
        port:
          number: 80
    headers:
      request:
        set:
          x-forwarded-proto: https
