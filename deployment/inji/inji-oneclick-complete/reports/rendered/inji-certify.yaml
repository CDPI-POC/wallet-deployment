# Source: inji-certify/templates/virtualservice.yaml
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: inji-certify
  namespace: inji-certify
  labels:
    app.kubernetes.io/name: inji-certify
    helm.sh/chart: inji-certify-0.14.0
    app.kubernetes.io/instance: inji-certify
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: inji
spec:
  hosts:
    - "*"
  gateways:
    - inji-certify-gateway
  http:
    - headers:
        request:
          set:
            x-forwarded-proto: https
        response:
          set:
            Cache-control: no-store
            Pragma: no-cache
            Strict-Transport-Security: max-age=31536000; includeSubDomains
            X-Frame-Options: SAMEORIGIN
      match:
        - uri:
            exact: /.well-known/openid-credential-issuer
      rewrite:
        uri: /v1/certify/issuance/.well-known/openid-credential-issuer
      route:
        - destination:
            host: inji-certify
            port:
              number: 80
    - headers:
        request:
          set:
            x-forwarded-proto: https
        response:
          set:
            Cache-control: no-store
            Pragma: no-cache
            Strict-Transport-Security: max-age=31536000; includeSubDomains
            X-Frame-Options: SAMEORIGIN
      match:
        - uri:
            exact: /.well-known/did.json
      rewrite:
        uri: /v1/certify/issuance/.well-known/did.json
      route:
        - destination:
            host: inji-certify
            port:
              number: 80
    - headers:
        request:
          set:
            x-forwarded-proto: https
        response:
          set:
            Cache-control: no-store
            Pragma: no-cache
            Strict-Transport-Security: max-age=31536000; includeSubDomains
            X-Frame-Options: SAMEORIGIN
      match:
        - uri:
            prefix: /
      route:
        - destination:
            host: inji-certify
            port:
              number: 80
