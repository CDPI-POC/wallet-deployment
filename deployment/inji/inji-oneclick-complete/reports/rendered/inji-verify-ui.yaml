# Source: inji-verify-ui/templates/nginx-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: inji-verify-ui-nginx-cm
  namespace: inji-verify
  labels:
    app.kubernetes.io/name: inji-verify-ui
    helm.sh/chart: inji-verify-ui-0.18.0
    app.kubernetes.io/instance: inji-verify-ui
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: inji
data:
  nginx.conf: |-
    worker_processes  1;
    
    events {
      worker_connections  1024;
    }
    
    http {
      access_log /var/log/nginx/access1.log;
      error_log /var/log/nginx/error1.log;
      client_max_body_size 10M;
      server {
        listen 8000;
        server_name  localhost;

        root   /usr/share/nginx/html;
        index  index.html index.htm;
        include /etc/nginx/mime.types;

        gzip on;
        gzip_min_length 1000;
        gzip_proxied expired no-cache no-store private auth;
        gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

        location /v1/verify {
          proxy_pass         http://inji-verify-service.injiverify/v1/verify;
          proxy_redirect     off;
          proxy_set_header   Host $host;
          proxy_set_header   X-Real-IP $remote_addr;
          proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header   X-Forwarded-Host $server_name;
        }
        location /.well-known/did.json {
          proxy_pass http://inji-verify-service.injiverify/v1/verify/.well-known/did.json;
          proxy_redirect     off;
          proxy_set_header   Host $host;
          proxy_set_header   X-Real-IP $remote_addr;
          proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header   X-Forwarded-Host $server_name;
          proxy_set_header   Connection close;
        }
  
        location / {
          try_files $uri $uri/ /index.html;
        }
      }
    }
