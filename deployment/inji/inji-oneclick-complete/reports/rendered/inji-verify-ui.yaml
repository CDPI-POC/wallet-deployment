                    app.kubernetes.io/instance: inji-verify-ui
                namespaces:
                  - "inji-verify"
                topologyKey: kubernetes.io/hostname
              weight: 1
        nodeAffinity:
          
      initContainers:
      containers:
        - name: inji-verify-ui
          image: docker.io/injistack/inji-verify-ui:0.18.0
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 0
          env:
            - name: container_user
              value: inji
            - name: JDK_JAVA_OPTIONS
